workflows:
  apk-debug:
    name: LeadFlow debug APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      # Secrets are embedded directly here for build reliability. Repo is
      # private; anon key + AI keys can be rotated any time from the
      # respective consoles.
      vars:
        SUPABASE_URL: "https://geqkvpbryprrnhjubeqi.supabase.co"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlcWt2cGJyeXBycm5oanViZXFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyODM0NjcsImV4cCI6MjA5OTg1OTQ2N30.Ijaq1G8NvluNYNP365_UNJEaFx42yRVDeP_c3ByJWjw"
        OCR_SPACE_API_KEY: "K87626153588957"
        GEMINI_API_KEY: "AQ.Ab8RN6LSBZtI-LWy7dsq9xc-rgntEQjBApdb8euL0C742y9CKg"
        GROQ_API_KEY: "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"
        GCV_API_KEY: "PASTE_YOUR_GOOGLE_CLOUD_VISION_KEY_HERE"

    scripts:
      - name: Flutter version
        script: flutter --version

      - name: Get packages
        script: flutter pub get

      - name: Analyse
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        script: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=OCR_SPACE_API_KEY="$OCR_SPACE_API_KEY" \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dart-define=GROQ_API_KEY="$GROQ_API_KEY" \
            --dart-define=GCV_API_KEY="$GCV_API_KEY"

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/logs/*.log
      # Fallback path some Flutter versions use.
      - build/**/outputs/apk/**/*.apk
