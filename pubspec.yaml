name: leadflow_ai
description: AI-powered Exhibition Lead CRM. Scan once. Organize forever.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  google_fonts: ^6.2.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  uuid: ^4.4.0
  http: ^1.2.2
  # On-device OCR for Android/iOS (no key, no network, no cost).
  # Web/desktop builds skip it via a conditional-import stub.
  google_mlkit_text_recognition: ^0.13.0
  # Audio recording — records mic to a local file on web + Android + iOS.
  # Output is uploaded to Groq's Whisper API for state-of-the-art
  # transcription (English + Hindi + Hinglish, auto-detected).
  record: ^5.1.2
  permission_handler: ^11.3.1
  # Audio playback of saved voice notes.
  just_audio: ^0.9.40
  # Excel-like data grid for the bulk-edit view.
  pluto_grid: ^8.0.0
  # xlsx read + write for the Bulk Edit export/import round-trip.
  excel: ^4.0.6
  file_picker: ^8.1.2
  file_saver: ^0.2.14
  # Persistent user settings (currently-active exhibition, etc.).
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# `record` pulls in `record_linux: 0.7.2`, which hasn't been updated for
# record_platform_interface 1.6.0 — the Dart compiler errors out even on
# Android builds because Flutter still analyses every platform impl.
# Force the fixed release.
dependency_overrides:
  record_linux: ^1.0.1

flutter:
  uses-material-design: true
